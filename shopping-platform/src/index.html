<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物平台</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>歡迎來到購物平台</h1>
    </header>
    <main>
        <!-- 商品列表 -->
        <section id="product-list">
            <h2>商品列表</h2>
            <div id="products"></div>
        </section>

        <!-- 購物車 -->
        <section id="cart">
            <h2>購物車</h2>
            <ul id="cart-items"></ul>
            <button id="checkout">結帳</button>
        </section>

        <!-- 購買紀錄 -->
        <section id="purchase-history">
            <h2>購買紀錄</h2>
            <ul id="history-items"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 購物平台</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
